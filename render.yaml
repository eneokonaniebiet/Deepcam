services:
  - type: web
    name: deep-live-cam-headless-engine
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NUM_THREADS
        value: "4"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEEPCAM_EXECUTION_PROVIDER
        value: "cpu"
      - key: DEEPCAM_EXECUTION_THREADS
        value: "4"
      - key: DEEPCAM_MAX_MEMORY_GB
        value: "2"
