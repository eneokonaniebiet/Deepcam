services:
  - type: web
    name: deepcam-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: apt-get update && apt-get install -y ffmpeg && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
